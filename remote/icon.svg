<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1e1e1e"/>
  <!-- the line being followed -->
  <path d="M 96 400 C 200 400 180 220 300 220 C 380 220 400 130 448 110"
        fill="none" stroke="#4ec9b0" stroke-width="28" stroke-linecap="round"/>
  <!-- robot body -->
  <g transform="translate(180 300)">
    <rect x="-70" y="-52" width="140" height="104" rx="22" fill="#0e639c"/>
    <!-- wheels -->
    <rect x="-90" y="-40" width="26" height="80" rx="13" fill="#d4d4d4"/>
    <rect x="64" y="-40" width="26" height="80" rx="13" fill="#d4d4d4"/>
    <!-- sensor eye -->
    <circle cx="0" cy="0" r="24" fill="#1e1e1e"/>
    <circle cx="0" cy="0" r="11" fill="#4ec9b0"/>
  </g>
</svg>
