[package]
edition      = "2024"
name         = "lf-hal"
version      = "0.1.0"
rust-version = "1.88"

[dependencies]
esp-hal          = { version = "~1.0", features = ["esp32", "log-04", "unstable"] }
esp-println      = { version = "0.16.1", features = ["esp32", "log-04"] }
critical-section = "1.2.0"
lf-hal-types     = { path = "../lf-hal-types" }
log              = "0.4.27"

[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-time = "0.5"
esp-alloc    = "0.9.0"
esp-rtos     = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp32", "log-04"] }
